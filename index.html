<!doctype html>
<html lang="is">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>Tónsögusmiðjan</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap">
<style>
/* Layout: sama fjölskylda og Tónlistarsmiðjan/Tónfræðismiðjan — bleikur pappír, Fredoka, hvít pillukort; tímaferð: skroll niður með leikandi hliðarstöðum og bognum tengingum, nótnastrengir í bakgrunni renna til hliðar; bakgrunnur tekur varlega lit tímabilsins; giskleikur í sér flipa */
:root{
  --bg:#FFF8FB; --surface:#FFFFFF; --ink:#27306B; --muted:#5A6190; --line:rgba(39,48,107,.14); --tint:#FCEAF3;
  --accent:#D62E86; --accent-ink:#FFFFFF; --accent-soft:#FFE1EF;
  --midaldir:#7A4FD6; --barokk:#0078BF; --klassik:#00A95C; --romantik:#D62E86; --nutimi:#FF6C2F;
  --midaldir-soft:#ECE4FB; --barokk-soft:#DCEFFB; --klassik-soft:#DDF5E8; --romantik-soft:#FFE1EF; --nutimi-soft:#FFE6DA;
  --blus:#2F5FB3; --rokk:#D93030; --bitlar:#C77F00; --disko:#B530BB; --hipp:#14897C; --nyold:#5E8A00; --island:#4B4FC7;
  --blus-soft:#DDE6F7; --rokk-soft:#FBE0E0; --bitlar-soft:#FBEBCB; --disko-soft:#F6DDF7; --hipp-soft:#D3F0EC; --nyold-soft:#E6F0CC; --island-soft:#E2E3F8;
  --mark:#F2B705; --mark-soft:#FFF3C4; --bar-ink:#FFFFFF; --shade:rgba(20,24,52,.55);
  --f-display:"Fredoka","Baloo 2",ui-rounded,"Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Fredoka","Baloo 2",ui-rounded,"Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1E2238; --surface:#272C47; --ink:#F3EEE4; --muted:#B9B6C9; --line:rgba(243,238,228,.18); --tint:#33304F;
  --accent:#FF6EC0; --accent-ink:#1E2238; --accent-soft:#4A2A4B;
  --midaldir:#B39BFF; --barokk:#4FB6F0; --klassik:#3CCB8A; --romantik:#FF6EC0; --nutimi:#FF8A5C;
  --midaldir-soft:#33284F; --barokk-soft:#1F3550; --klassik-soft:#1D3B30; --romantik-soft:#4A2A4B; --nutimi-soft:#4A3026;
  --blus:#7FA6EE; --rokk:#FF7A7A; --bitlar:#FFC04D; --disko:#EE7CF2; --hipp:#4FD6C4; --nyold:#B5D84A; --island:#9A9DFF;
  --blus-soft:#22314D; --rokk-soft:#4A2626; --bitlar-soft:#4A3A1A; --disko-soft:#43244A; --hipp-soft:#193D39; --nyold-soft:#333D1A; --island-soft:#2A2B52;
  --mark:#FFD21F; --mark-soft:#4A4224; --bar-ink:#1E2238; --shade:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1E2238; --surface:#272C47; --ink:#F3EEE4; --muted:#B9B6C9; --line:rgba(243,238,228,.18); --tint:#33304F;
  --accent:#FF6EC0; --accent-ink:#1E2238; --accent-soft:#4A2A4B;
  --midaldir:#B39BFF; --barokk:#4FB6F0; --klassik:#3CCB8A; --romantik:#FF6EC0; --nutimi:#FF8A5C;
  --midaldir-soft:#33284F; --barokk-soft:#1F3550; --klassik-soft:#1D3B30; --romantik-soft:#4A2A4B; --nutimi-soft:#4A3026;
  --blus:#7FA6EE; --rokk:#FF7A7A; --bitlar:#FFC04D; --disko:#EE7CF2; --hipp:#4FD6C4; --nyold:#B5D84A; --island:#9A9DFF;
  --blus-soft:#22314D; --rokk-soft:#4A2626; --bitlar-soft:#4A3A1A; --disko-soft:#43244A; --hipp-soft:#193D39; --nyold-soft:#333D1A; --island-soft:#2A2B52;
  --mark:#FFD21F; --mark-soft:#4A4224; --bar-ink:#1E2238; --shade:rgba(0,0,0,.6); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.6;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:clamp(1.7rem,4vw,2.4rem);font-weight:600}
h2{font-size:1.55rem;font-weight:600}
h3{font-size:1.12rem;font-weight:600}
p{margin:0}
.muted{color:var(--muted)}
.eyebrow{font-size:.78rem;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:14px}
.stack-lg{display:flex;flex-direction:column;gap:24px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:18px;padding-block:10px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:600;font-size:1.1rem;color:var(--ink);text-decoration:none;display:flex;align-items:center;gap:10px}
.brand-mark{display:flex;gap:4px;align-items:center}
.brand-mark b{width:14px;height:14px;display:block}
.brand-mark b:nth-child(1){background:var(--barokk);border-radius:50%}
.brand-mark b:nth-child(2){background:var(--klassik);border-radius:3px;transform:rotate(45deg) scale(.85)}
.brand-mark b:nth-child(3){background:var(--romantik);border-radius:42% 58% 63% 37%/45% 40% 60% 55%}
nav.tabs{display:flex;gap:4px;margin-left:auto;background:var(--surface);border-radius:999px;padding:4px;box-shadow:0 2px 0 var(--line)}
nav.tabs a{text-decoration:none;color:var(--muted);padding:8px 18px;border-radius:999px;font-size:.98rem;font-weight:500;white-space:nowrap}
nav.tabs a[aria-current="page"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
@media (max-width:560px){header.top .wrap{flex-wrap:nowrap;gap:10px;padding-block:8px}.brand .bt{display:none}nav.tabs a{padding:6px 12px;font-size:.88rem}}
main{padding:0}
.view[data-view="thekkir"].enter{animation:viewIn .35s cubic-bezier(.2,.7,.2,1)}
@keyframes viewIn{from{opacity:.3;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.view.enter{animation:none}}

html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}

/* Leitarborðinn */
.namebar{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--hh,60px));z-index:8;background:var(--bg);border-bottom:1px solid var(--line)}
.namebar .wrap{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-block:10px}
.namebar[hidden]{display:none}
.pick,.search input{font:inherit;font-size:.95rem;color:var(--ink);background:var(--surface);border:2px solid var(--line);border-radius:999px;padding:8px 16px;min-height:42px}
.pick{cursor:pointer;max-width:100%;padding-right:12px}
.search{position:relative;flex:1;min-width:200px;max-width:420px}
.search input{width:100%;padding-left:40px}
.search svg{position:absolute;left:14px;top:50%;margin-top:-9px;color:var(--muted);pointer-events:none}
.results{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--surface);border-radius:18px;box-shadow:0 12px 30px -10px rgba(39,48,107,.4),0 0 0 1px var(--line);padding:6px;max-height:min(60vh,420px);overflow-y:auto;z-index:20;list-style:none;margin:0}
.results li button{width:100%;font:inherit;text-align:left;border:0;background:none;color:var(--ink);border-radius:12px;padding:8px 10px;display:flex;gap:10px;align-items:center;cursor:pointer}
.results li button:hover,.results li button.on{background:var(--tint)}
.results .dot{width:10px;height:10px;border-radius:50%;flex:none}
.results small{display:block;color:var(--muted);font-size:.8rem}
.results .none{padding:10px;color:var(--muted)}
.eras-jump{display:flex;gap:6px;flex-wrap:wrap}
.eras-jump a{text-decoration:none;font-size:.85rem;font-weight:600;color:var(--ink);background:var(--chip-soft);border-radius:999px;padding:6px 12px;display:inline-flex;align-items:center;gap:6px}
.eras-jump a .dot{width:9px;height:9px;border-radius:50%;background:var(--chip)}
.eras-jump a.active{background:var(--chip);color:var(--bar-ink)}
.eras-jump a.active .dot{background:var(--bar-ink)}
@media (max-width:700px){.namebar .wrap{gap:8px;padding-block:8px}.eras-jump{width:100%;order:3;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}.eras-jump a{flex:none;padding:4px 10px}.search{min-width:0;flex:1 1 0}.pick{flex:1 1 0;min-width:0;width:0}.pick,.search input{min-height:38px;font-size:.88rem;padding-block:6px}.search input{padding-left:34px}.search svg{left:11px}}

/* Tímaferðin: venjulegt skroll niður; miðarnir raðast leikandi til hliðanna með bognum, misvíðum tengingum; nótnastrengir í bakgrunni renna til vinstri þegar skrollað er og gefa tilfinningu fyrir ferð til hliðar */
body{transition:background-color 1.2s ease}
.bgl{position:fixed;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:0;overflow:hidden}
.bgl .w{position:absolute;left:0;top:0;will-change:transform}
.blob{position:absolute;border-radius:50%;background:radial-gradient(circle at 50% 50%, var(--c) 0, transparent 68%);opacity:.2}
.bit{position:absolute;opacity:.14}
.bit.c{border-radius:50%}.bit.d{border-radius:16%;transform:rotate(45deg)}.bit.b{border-radius:42% 58% 63% 37%/45% 40% 60% 55%}
.story{position:relative;z-index:1;overflow-x:clip;padding-block:30px 30vh}
.links{position:absolute;inset:0;pointer-events:none;overflow:visible}
.links path{fill:none;stroke-width:3;stroke-linecap:round;stroke-dasharray:2 9;opacity:.6}
.it{position:relative;display:flex;flex-direction:column;align-items:center;margin-bottom:var(--gap,70px)}
.mv{display:flex;flex-direction:column;align-items:center;gap:10px;transform:translateX(var(--x,0px))}
.intro{max-width:34rem;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;background:var(--bg);padding:10px 18px;border-radius:24px}
.chap{display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center;width:min(900px,calc(100vw - 32px));padding:40px clamp(20px,5vw,56px) 34px;border-radius:34px;scroll-margin-top:160px;
  background:color-mix(in srgb, var(--soft) 65%, var(--surface));outline:1px solid var(--line);outline-offset:-1px;box-shadow:0 2px 0 var(--line),0 30px 50px -26px rgba(39,48,107,.45);position:relative;overflow:hidden}
.chap::before{content:"";position:absolute;left:0;right:0;top:0;height:10px;background:var(--col)}
.chap .badge{display:inline-flex;align-items:baseline;gap:14px;background:var(--col);color:var(--bar-ink);font-family:var(--f-display);font-weight:600;font-size:clamp(2rem,6vw,3.2rem);line-height:1.1;border-radius:999px;padding:12px 34px;box-shadow:0 5px 0 var(--line)}
.chap .badge small{font-weight:400;font-size:.42em;opacity:.92;font-variant-numeric:tabular-nums}
.chap p{max-width:46ch;font-size:clamp(1.05rem,2.4vw,1.3rem);line-height:1.5}
.chap .n{color:var(--muted);font-size:.95rem}
.chap .faces{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;max-width:100%}
.chap .faces button{border:0;padding:0;background:none;cursor:pointer;border-radius:50%;transition:transform .15s}
.chap .faces button:hover,.chap .faces button:focus-visible{transform:translateY(-3px)}
.chap .faces .face{width:52px;height:52px;font-size:.95rem;box-shadow:0 0 0 3px var(--surface)}
.pill{position:relative;z-index:2;font-family:var(--f-display);font-weight:600;font-size:.95rem;color:var(--bar-ink);background:var(--col);border-radius:999px;padding:4px 14px;box-shadow:0 0 0 5px var(--bg);font-variant-numeric:tabular-nums}

/* Miðarnir */
.note{position:relative;border:0;font:inherit;color:var(--ink);text-align:left;cursor:pointer;
  width:min(var(--nw,390px),calc(100vw - 36px));aspect-ratio:4/3;scroll-margin-top:160px;
  background:color-mix(in srgb, var(--soft) 72%, var(--surface));border-radius:6px 6px 6px 28px;padding:28px 22px 16px;
  outline:1px solid var(--line);outline-offset:-1px;
  box-shadow:0 2px 0 var(--line),0 26px 44px -20px rgba(39,48,107,.5),0 6px 14px -8px rgba(39,48,107,.25);
  transform:perspective(900px) rotateY(var(--ry,0deg)) scale(var(--s,1)) rotate(var(--rot,0deg));transform-origin:50% 50%;
  display:flex;flex-direction:column;gap:8px;transition:box-shadow .25s}
.note:hover,.note:focus-visible{box-shadow:0 1px 0 var(--line),0 22px 34px -14px rgba(39,48,107,.5);--rot:0deg}
.note::before{content:"";position:absolute;top:-11px;left:50%;width:90px;height:22px;margin-left:-45px;background:var(--col);opacity:.55;border-radius:3px;transform:rotate(-3deg)}
.note.hit{animation:hit 1.6s ease-out}
@keyframes hit{0%,45%{box-shadow:0 0 0 6px var(--col),0 16px 26px -14px rgba(39,48,107,.4)}100%{box-shadow:0 1px 0 var(--line),0 16px 26px -14px rgba(39,48,107,.4)}}
.note .top{display:flex;gap:12px;align-items:center}
.note .top>div{min-width:0}
.note h3{font-size:1.5rem}
.note .meta{font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums}
.note .tease{font-size:1rem;line-height:1.45;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.note .foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.84rem}
.note .work{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.note .more{font-weight:600;color:var(--col);white-space:nowrap}
.note .face{width:84px;height:84px;font-size:1.4rem;box-shadow:0 0 0 3px var(--surface)}
@media (max-height:620px){.note .tease{-webkit-line-clamp:2}.note .face{width:54px;height:54px}}

/* Andlitsmerki (upphafsstafir, eða mynd ef c.img er sett) */
.face{position:relative;width:96px;height:96px;border-radius:50%;flex:none;display:grid;place-items:center;font-family:var(--f-display);font-weight:600;font-size:1.6rem;color:var(--bar-ink);overflow:hidden;box-shadow:0 0 0 4px var(--surface)}
.face img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 18%}
.credit{font-size:.75rem;color:var(--muted)}
.credit a{color:inherit}

/* Myndbönd með smámynd */
.vid{position:relative;display:block;width:100%;aspect-ratio:16/9;max-width:100%;border-radius:18px;overflow:hidden;background:var(--vcol,var(--ink));color:var(--bar-ink);text-decoration:none;border:0;padding:0;cursor:pointer;font:inherit}
.vid img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .3s, filter .3s}
.vid:hover img{transform:scale(1.03)}
.vid .shade{position:absolute;inset:auto 0 0 0;padding:28px 14px 12px;background:linear-gradient(transparent,var(--shade));display:flex;align-items:center;gap:12px;text-align:left}
.vid .play{width:48px;height:48px;border-radius:50%;background:var(--accent);display:grid;place-items:center;flex:none;box-shadow:0 3px 0 rgba(0,0,0,.2)}
.vid .play::after{content:"";border-left:15px solid var(--accent-ink);border-top:9px solid transparent;border-bottom:9px solid transparent;margin-left:4px}
.vid .t{font-weight:600;line-height:1.25;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.4)}
.vid .t small{display:block;font-weight:400;opacity:.9;font-size:.8rem}
.vid.noimg .shade{inset:0;background:none;justify-content:center;flex-direction:column;text-align:center}
.vid.noimg .t{color:var(--bar-ink);text-shadow:none}
.vid .sib{position:absolute;top:10px;left:10px;z-index:2;background:#fff;color:#1d2b5c;font-size:.72rem;font-weight:700;padding:4px 10px;border-radius:99px;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.vid.small .play{width:36px;height:36px}
.vid.small .play::after{border-left-width:11px;border-top-width:7px;border-bottom-width:7px}
.vid.small .t{font-size:.88rem}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}

/* Kort fyrir "Þekkir þú lagið?" */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.vcard{background:var(--surface);border-radius:22px;box-shadow:0 2px 0 var(--line);overflow:hidden;display:flex;flex-direction:column;min-width:0}
.vcard .vid{border-radius:0}
.vcard .vid img{filter:blur(14px) saturate(1.2);transform:scale(1.15)}
.vcard.shown .vid img{filter:none;transform:none}
.vcard .body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:10px;flex:1}
.vcard h3{font-size:1.05rem}
.vcard .who{font-size:.95rem;font-weight:600;border-radius:12px;padding:8px 12px;display:flex;gap:8px;align-items:center}
.vcard .who .dot{width:10px;height:10px;border-radius:50%;flex:none}
.vcard .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}
.btn{font:inherit;font-weight:600;font-size:.92rem;border-radius:999px;padding:8px 16px;border:0;cursor:pointer;background:var(--accent);color:var(--accent-ink);text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn.ghost{background:var(--accent-soft);color:var(--ink)}
.btn.small{padding:6px 12px;font-size:.85rem}

/* Tabbar: styttri heiti á síma */
nav.tabs .sm{display:none}
@media (max-width:560px){nav.tabs .lg{display:none}nav.tabs .sm{display:inline}}
/* Tímalínuval */
.switch{display:inline-flex;background:var(--surface);border-radius:999px;padding:3px;box-shadow:0 0 0 2px var(--line) inset}
.switch button{font:inherit;font-size:.9rem;font-weight:600;border:0;background:none;color:var(--muted);border-radius:999px;padding:7px 14px;cursor:pointer;white-space:nowrap}
.switch button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
@media (max-width:700px){.switch{order:-1;width:100%}.switch button{flex:1}}
.wtag{display:inline-block;margin-top:4px;font-size:.72rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--col);background:var(--surface);border-radius:999px;padding:2px 8px}
.soon{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;width:min(900px,calc(100vw - 32px))}
.soon div{background:var(--surface);border-radius:20px;padding:16px;outline:1px solid var(--line);outline-offset:-1px;display:flex;flex-direction:column;gap:4px;border-top:6px solid var(--c)}
.soon b{font-family:var(--f-display);font-size:1.15rem}
.soon small{color:var(--muted)}
/* Tónskáld vikunnar */
.wk-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:18px}
.wk-bar .pick{flex:1 1 220px;min-width:0}
.wk{--col:var(--accent);--soft:var(--tint);background:color-mix(in srgb, var(--soft) 55%, var(--surface));border-radius:34px;outline:1px solid var(--line);outline-offset:-1px;box-shadow:0 2px 0 var(--line),0 30px 50px -28px rgba(39,48,107,.45);overflow:hidden;display:flex;flex-direction:column}
.wk:focus{outline:1px solid var(--line)}
.wk:fullscreen{border-radius:0;overflow-y:auto;background:color-mix(in srgb, var(--soft) 55%, var(--bg))}
.wk-head{display:flex;gap:clamp(18px,3vw,36px);align-items:center;padding:clamp(22px,4vw,44px);border-top:12px solid var(--col);flex-wrap:wrap}
.wk-head .face{width:clamp(120px,16vw,200px);height:clamp(120px,16vw,200px);font-size:clamp(2.2rem,4vw,3.4rem);box-shadow:0 0 0 6px var(--surface)}
.wk-head>div{flex:1 1 320px;min-width:0;display:flex;flex-direction:column;gap:10px}
.wk-head h1{font-size:clamp(2.4rem,6vw,4.6rem);line-height:1}
.wk-head .lead{font-size:clamp(1.1rem,1.8vw,1.4rem);line-height:1.5}
.wk-head .eyebrow{color:var(--col);font-weight:600;font-size:.9rem}
.wk-body{display:grid;grid-template-columns:1.1fr 1fr;gap:clamp(18px,3vw,32px);padding:0 clamp(22px,4vw,44px) clamp(22px,4vw,44px)}
.wk-body>*{min-width:0;display:flex;flex-direction:column;gap:12px}
@media (max-width:860px){.wk-body{grid-template-columns:1fr}}

  box-shadow:0 0 0 1px var(--line),0 30px 70px -20px rgba(20,24,50,.45);transform:translateX(calc(100% + 40px));opacity:.4;transition:transform .45s cubic-bezier(.2,.8,.2,1),opacity .3s}
dialog#dlg.in{transform:none;opacity:1}
.story{transition:transform .5s cubic-bezier(.2,.8,.2,1)}
body.panel-open .story{transform:translateX(calc(-1 * var(--shift)))}
.it .mv{transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.it.sel{z-index:3}
.it.sel .mv{transform:translateX(0) scale(1.08)}
.it.sel .note{box-shadow:0 0 0 5px var(--col),0 34px 60px -18px rgba(39,48,107,.6);--rot:0deg}

/* Boomwhacker-spilarinn: settu hér slóðina á spilarann á GitHub Pages */
/* Boomwhacker-spilarinn. Settu hér GitHub-slóð spilarans, t.d. "https://NOTANDI.github.io/boomwhacker/boomwhacker-spilari.html"
   bw:["Nafn lags"]                         → opnar lag úr lagalista spilarans (?lag=)
   bw:[{t:"Titill", skra:"log/x.mid"}]      → opnar MIDI/MusicXML-skrá sem liggur við hlið spilarans (?skra=) */
const BOOMWHACKER_URL = ""; /* Í geymslu: settu slóðina inn aftur til að birta Boomwhacker-hnappana */
const bwHref = s => { const o = typeof s==="string" ? {t:s} : s, q = new URLSearchParams();
  if(o.skra){ q.set("skra",o.skra); q.set("titill",o.t); } else q.set("lag",o.lag||o.t);
  if(o.hradi) q.set("hradi",o.hradi);
  return BOOMWHACKER_URL+(BOOMWHACKER_URL.includes("?")?"&":"?")+q.toString(); };
const bwHtml = c => (c.bw&&c.bw.length&&BOOMWHACKER_URL) ? `<section class="bw-sec" style="--col:${eraVar(c.era)}"><h3>Spilaðu með á Boomwhackers</h3><div class="bw">${c.bw.map(s=>`<a class="btn small" href="${esc(bwHref(s))}" target="_blank" rel="noopener">▶ ${esc(typeof s==="string"?s:s.t)}</a>`).join("")}</div></section>` : "";

const story=document.getElementById("story"), bgl=document.getElementById("bgl"), bgw=document.getElementById("bgw");

function seeded(n){ let x=Math.sin(n*99.13+3.7)*43758.5453; return x-Math.floor(x); }
function buildStory(){
  document.querySelectorAll(".tl-only").forEach(el=>el.hidden=false);
  const D = TL==="daegur";
  renderStory();
  const all=sorted(); let h="", n=0;
  h+= D ? `<div class="it" style="--gap:60px"><div class="mv"><div class="intro"><h1>Dægurtónlistarsaga</h1><p class="muted">Skrollaðu frá blús og djassi til tónlistar dagsins. Smelltu á miða til að hlusta og fræðast.</p></div></div></div>`
        : `<div class="it" style="--gap:60px"><div class="mv"><div class="intro"><h1>Sígild tónlistarsaga</h1><p class="muted">Skrollaðu í gegnum söguna, frá miðöldum til nútímans. Smelltu á miða til að hlusta og fræðast.</p></div></div></div>`;
  ERA_ORDER.filter(k=>tlOfEra(k)===TL).forEach(k=>{
    const e=ERAS[k], list=all.filter(c=>c.era===k), col=eraVar(k);
    if(!list.length) return;
    h+=`<div class="it" data-era="${k}" style="--gap:110px;margin-top:70px"><div class="mv"><div class="chap" id="era-${k}" style="--col:${col}"><span class="badge">${e.name} <small>${e.years}</small></span><p>${e.text}</p><span class="n">${list.length} ${D?"flytjendur":"tónskáld"}</span></div></div></div>`;
    list.forEach(c=>{ n++;
      h+=`<div class="it" data-era="${k}" data-id="${c.id}" data-n="${n}"><div class="mv" style="--col:${col}"><span class="pill">${D?(c.y||c.b):(c.approx?"um ":"")+c.b}</span>${noteHtml(c,n)}</div></div>`;
    });
  });
  h+= D ? `<div class="it"><div class="mv"><div class="intro"><h2>Komin til dagsins í dag!</h2><p class="muted">Hvaða tónlistarfólk á að bætast við næst? Skiptu yfir í sígilda tónlist til að fara enn lengra aftur í tímann.</p><button type="button" class="btn" data-tlgo="sigild">Sígild tónlistarsaga →</button></div></div></div>`
        : `<div class="it"><div class="mv"><div class="intro"><h2>Komin í lok 20. aldarinnar!</h2><p class="muted">Haltu áfram í dægurtónlistinni, frá blús og djassi til tónlistar dagsins.</p><button type="button" class="btn" data-tlgo="daegur">Dægurtónlistarsaga →</button></div></div></div>`;
  story.innerHTML=h+`<svg class="links" id="links" aria-hidden="true"></svg>`;
  ROWS=[...story.querySelectorAll(".it")].map(el=>({el,mv:el.firstElementChild,era:el.dataset.era,id:el.dataset.id,n:+el.dataset.n||0}));
  lastEra=""; lastActive="";
  measure();
}
/* Leikandi staðsetning: hvert tónskáld fær sína hliðarstöðu og sitt bil, með smá óreglu */
function measure(){
  queueMicrotask(()=>buildAxis());
  const W=story.clientWidth, narrow=W<700;
  const span = narrow ? W*0.07 : Math.min(300,W*0.24);
  let prev=0;
  ROWS.forEach(r=>{
    if(!r.n){ r.mv.style.setProperty("--x","0px"); return; }
    let x=(seeded(r.n)*2-1)*span;
    if(Math.abs(x-prev)<span*0.35) x = prev>0 ? -Math.abs(x)-span*0.2 : Math.abs(x)+span*0.2;  // forðast að tveir lendi beint undir hvor öðrum
    x=Math.max(-span,Math.min(span,x)); prev=x;
    r.mv.style.setProperty("--x",x.toFixed(0)+"px");
    r.el.style.setProperty("--gap",Math.round((narrow?36:44)+seeded(r.n+50)*(narrow?40:110))+"px");
  });
  requestAnimationFrame(()=>{ drawLinks(); buildBg(); });
}
/* Bakgrunnslag: mjúkir litablettir og fá form sem liggja dýpra. Þeir færast hægar upp en miðarnir (dýpt) og renna aðeins til vinstri (ferð til hliðar). */
function buildBg(){
  const W=window.innerWidth, H=window.innerHeight, docH=story.scrollHeight;
  const eraAt=y=>{ let e=TL==="daegur"?"blus":"barokk"; ROWS.forEach(r=>{ if(r.era && r.el.offsetTop<=y) e=r.era; }); return e; };
  let h="", i=0;
  for(let y=0; y<docH; y+=Math.max(260,H*0.42)){
    i++;
    const era=eraAt(y+H*0.5);
    const ly=y*DEPTH_Y+H*0.15, lx=y*DEPTH_X;
    const bs=Math.round(Math.max(W,H)*(0.35+seeded(i)*0.3));
    const bx=lx+(seeded(i+3)<.5?-bs*0.35:W-bs*0.6)+seeded(i+9)*W*0.15;
    h+=`<span class="blob" style="--c:var(--${era});left:${bx}px;top:${ly-bs/2}px;width:${bs}px;height:${bs}px"></span>`;
    if(i%2===0){ const s=Math.round(26+seeded(i+5)*44), k=["c","d","b"][i%3];
      h+=`<span class="bit ${k}" style="background:var(--${era});left:${lx+seeded(i+7)*W}px;top:${ly+seeded(i+8)*H*0.3}px;width:${s}px;height:${s}px"></span>`; }
  }
  bgw.innerHTML=h;
  onScroll();
}
function drawLinks(){
  const svg=document.getElementById("links"); if(!svg) return;
  const sb=story.getBoundingClientRect();
  svg.setAttribute("width",sb.width); svg.setAttribute("height",story.scrollHeight);
  let d="";
  const items=ROWS.map(r=>{
    const pill=r.el.querySelector(".pill"), note=r.el.querySelector(".note")||r.mv.firstElementChild;
    const top=(pill||note).getBoundingClientRect(), bot=note.getBoundingClientRect();
    return {era:r.era, tx:top.left+top.width/2-sb.left, ty:top.top-sb.top, bx:bot.left+bot.width/2-sb.left, by:bot.bottom-sb.top};
  });
  for(let i=0;i<items.length-1;i++){
    const a=items[i], b=items[i+1], dy=b.ty-a.by, bend=(seeded(i+20)-.5)*120;
    const col=eraVar(b.era||a.era||"barokk");
    d+=`<path stroke="${col}" d="M${a.bx.toFixed(1)},${a.by.toFixed(1)} C${(a.bx+bend).toFixed(1)},${(a.by+dy*0.55).toFixed(1)} ${(b.tx-bend).toFixed(1)},${(b.ty-dy*0.55).toFixed(1)} ${b.tx.toFixed(1)},${(b.ty-4).toFixed(1)}"/>`;
  }
  svg.innerHTML=d;
}
let ticking=false, lastActive="", lastEra="";
function onScroll(){
  if(document.querySelector('[data-view="timalina"]').hidden) return;
  const y=window.scrollY, st=stickPx(), cy=st+(window.innerHeight-st)/2;
  const ky=reduce()?0:DEPTH_Y, kx=reduce()?0:DEPTH_X;
  bgw.style.transform=`translate3d(${(-y*kx).toFixed(1)}px,${(-y*ky).toFixed(1)}px,0)`;
  let best=null, bd=1e9;
  ROWS.forEach(r=>{ const b=r.el.getBoundingClientRect(); const dy=Math.abs(b.top+b.height/2-cy); if(dy<bd){ bd=dy; best=r; } });
  if(!best) return;
  const era=best.era||ERA_ORDER[0];
  if(era!==lastEra){ lastEra=era;
    document.body.style.backgroundColor=`color-mix(in srgb, var(--${era}-soft) 40%, var(--bg))`;
  }
  const act = best.id ? "t-"+best.id : (best.era?"era-"+best.era:"");
  if(act && act!==lastActive){ lastActive=act; setActive(act); }
  updateAxis();
}

let AX={start:0,end:1,segs:[]};
const axIn=document.getElementById("axIn");
function docTop(el){ return el.getBoundingClientRect().top+scrollY; }
function buildAxis(){
  const chaps=[...story.querySelectorAll(".chap")]; if(!chaps.length) return;
  const items=story.querySelectorAll(".it[data-id]"), last=items[items.length-1];
  const start=docTop(chaps[0]), end=last?docTop(last)+last.offsetHeight:start+1;
  const segs=chaps.map((c,i)=>{ const k=c.id.slice(4), a=docTop(c), b=i<chaps.length-1?docTop(chaps[i+1]):end; return {k,a,b}; });
  AX={start,end,segs};
  const tot=end-start;
  document.getElementById("axTrack").innerHTML=segs.map(g=>`<span class="ax-seg" data-k="${g.k}" style="--k:var(--${g.k});flex:${((g.b-g.a)/tot).toFixed(4)} 1 0" title="${esc(ERAS[g.k].name)} ${ERAS[g.k].years}">${esc(eraShort(g.k))}</span>`).join("");
  let acc=0;
  document.getElementById("axYrs").innerHTML=segs.map(g=>{ const l=acc; acc+=(g.b-g.a)/tot*100; return `<span style="left:${l.toFixed(2)}%">${esc(ERAS[g.k].years.split("–")[0])}</span>`; }).join("");
  updateAxis();
}
function axFrac(){ const st=stickPx(), cy=scrollY+st+(innerHeight-st-(parseFloat(getComputedStyle(document.body).getPropertyValue("--axh"))||0))/2; return Math.max(0,Math.min(1,(cy-AX.start)/(AX.end-AX.start))); }
function updateAxis(){
  if(!AX.segs.length) return;
  const f=axFrac(), knob=document.getElementById("axKnob");
  knob.style.left=(f*100).toFixed(2)+"%";
  axIn.setAttribute("aria-valuenow",Math.round(f*100));
  const id=lastActive.startsWith("t-")?lastActive.slice(2):null, c=id&&byId[id];
  const era=c?c.era:(lastActive.startsWith("era-")?lastActive.slice(4):"");
  const yr=c?(c.tl==="daegur"?(c.y||c.b):c.b):(era&&ERAS[era]?ERAS[era].years.split("–")[0]:"");
  document.getElementById("axYear").textContent=yr?((c&&c.approx?"um ":"")+yr):"";
  axIn.setAttribute("aria-valuetext",(era&&ERAS[era]?ERAS[era].name:"")+(yr?", "+yr:""));
  document.querySelectorAll(".ax-seg").forEach(s=>s.classList.toggle("on",s.dataset.k===era));
}
function axSeek(clientX){
  const r=axIn.getBoundingClientRect(), f=Math.max(0,Math.min(1,(clientX-r.left)/r.width));
  const st=stickPx(), axh=parseFloat(getComputedStyle(document.body).getPropertyValue("--axh"))||0;
  window.scrollTo({top:AX.start+f*(AX.end-AX.start)-st-(innerHeight-st-axh)/2,behavior:"auto"});
}
axIn.addEventListener("pointerdown",ev=>{ axIn.setPointerCapture(ev.pointerId); axIn.classList.add("drag"); axSeek(ev.clientX); });
axIn.addEventListener("pointermove",ev=>{ if(axIn.classList.contains("drag")) axSeek(ev.clientX); });
["pointerup","pointercancel"].forEach(t=>axIn.addEventListener(t,()=>axIn.classList.remove("drag")));

  rachmaninoff:["Sergej Rakhmanínov","Sergej Rakhmaninov","Sergei Rachmaninoff"],

};
let openId=null;
(async function checkWiki(){
  try{
    const cached=JSON.parse(localStorage.getItem("tss-iswiki2")||"null");
    if(cached && Date.now()-cached.t<7*864e5){ Object.assign(IS_WIKI,cached.m); return; }
  }catch(e){}
  const cand=ALL.map(c=>({id:c.id,titles:[c.name,...(WIKI_ALT[c.id]||[])]}));
  const all=[...new Set(cand.flatMap(x=>x.titles))];
  const found={};
  try{
    for(let i=0;i<all.length;i+=45){
      const chunk=all.slice(i,i+45);
      const r=await fetch("https://is.wikipedia.org/w/api.php?action=query&format=json&redirects=1&origin=*&titles="+encodeURIComponent(chunk.join("|")));
      const j=await r.json(), qy=j.query||{};
      const map={}; chunk.forEach(x=>map[x]=x);
      (qy.normalized||[]).forEach(n=>{ for(const k in map) if(map[k]===n.from) map[k]=n.to; });
      (qy.redirects||[]).forEach(n=>{ for(const k in map) if(map[k]===n.from) map[k]=n.to; });
      const ok=new Set(Object.values(qy.pages||{}).filter(p=>!("missing" in p)&&!("invalid" in p)).map(p=>p.title));
      chunk.forEach(x=>{ if(ok.has(map[x])) found[x]=map[x]; });
    }
  }catch(e){ return; }
  cand.forEach(x=>{ const hit=x.titles.find(tt=>found[tt]); if(hit) IS_WIKI[x.id]="https://is.wikipedia.org/wiki/"+encodeURIComponent(found[hit].replace(/ /g,"_")); });
  try{ localStorage.setItem("tss-iswiki2",JSON.stringify({t:Date.now(),m:IS_WIKI})); }catch(e){}
  if(openId && dlg.open) openComposer(openId);
})();

document.getElementById("cards").innerHTML = VIRAL.map(([work,cid,vid],i)=>{
  const c=cid?byId[cid]:null, col=c?eraVar(c.era):"var(--mark)";
  const who = c?`<span class="dot" style="background:${col}"></span>${esc(c.name)} <span class="muted">· ${yrs(c)}</span>`:`<span class="dot" style="background:${col}"></span>Hefðbundið rússneskt þjóðlag`;
  return `<article class="vcard" id="card${i}">
    ${vidHtml({id:vid,title:"Lag "+(i+1)},col,false)}
    <div class="body">
      <h3>${esc(work)}</h3>
      <p class="who" hidden style="background:${c?`var(--${c.era}-soft)`:"var(--mark-soft)"}">${who}</p>
      <p class="muted hint">Hver samdi? Giskaðu fyrst!</p>
      <div class="acts">
        <button class="btn small" type="button" data-reveal="${i}">Sýna tónskáldið</button>
        ${c?`<button class="btn ghost small" type="button" data-open="${c.id}" hidden>Meira um ${esc(c.short)}</button>`:""}
      </div></div></article>`;
}).join("");
function reveal(i,show){
  const card=document.getElementById("card"+i);
  card.classList.toggle("shown",show);
  card.querySelector(".who").hidden=!show; card.querySelector(".hint").hidden=show;
  const o=card.querySelector("[data-open]"); if(o) o.hidden=!show;
  card.querySelector("[data-reveal]").textContent = show?"Fela":"Sýna tónskáldið";
}
document.getElementById("cards").addEventListener("click",ev=>{
  const r=ev.target.closest("[data-reveal]"); if(r){ const i=+r.dataset.reveal; reveal(i, !document.getElementById("card"+i).classList.contains("shown")); return; }
  const o=ev.target.closest("[data-open]"); if(o) openComposer(o.dataset.open);
});
document.getElementById("revealAll").onclick=()=>VIRAL.forEach((_,i)=>reveal(i,true));
document.getElementById("hideAll").onclick=()=>VIRAL.forEach((_,i)=>reveal(i,false));

/* Tímalínuval: sígild tónlist eða dægurtónlist */
function setTL(v){
  TL=v; document.querySelectorAll("#tlSwitch button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.tl===v?"true":"false"));
  try{ localStorage.setItem("tss-tl",v); }catch(e){}
  buildStory(); setHH(); window.scrollTo({top:0,behavior:"auto"}); lastEra=""; onScroll();
}
document.getElementById("tlSwitch").addEventListener("click",ev=>{const b=ev.target.closest("button[data-tl]"); if(b && b.dataset.tl!==TL) setTL(b.dataset.tl);});
story.addEventListener("click",ev=>{const b=ev.target.closest("[data-tlgo]"); if(b) setTL(b.dataset.tlgo);});

/* Tónskáld vikunnar: stór sýn fyrir skjávarpann */
const WEEKS=[...WEEK_FIRST.map(id=>byId[id]).filter(Boolean), ...sorted("sigild").filter(c=>!WEEK_FIRST.includes(c.id))];
const wkPick=document.getElementById("wkPick"), wkEl=document.getElementById("wk");
wkPick.innerHTML=WEEKS.map((c,i)=>`<option value="${i}">Vika ${i+1} · ${esc(c.short)}</option>`).join("");
let wkI=0; try{ const s=localStorage.getItem("tss-week"); if(s!==null && +s>=0 && +s<WEEKS.length) wkI=+s; }catch(e){}
function renderWeek(i){
  wkI=(i+WEEKS.length)%WEEKS.length; const c=WEEKS[wkI], col=eraVar(c.era);
  wkPick.value=String(wkI);
  try{ localStorage.setItem("tss-week",String(wkI)); }catch(e){}
  const [v0,...vr]=c.videos;
  wkEl.style.setProperty("--col",col); wkEl.style.setProperty("--soft",`var(--${c.era}-soft)`); wkEl.style.setProperty("--era",col);
  wkEl.innerHTML=`
    <div class="wk-head">${faceHtml(c)}<div>
      <p class="eyebrow">Tónskáld vikunnar · Vika ${wkI+1}</p>
      <h1>${esc(c.name)}</h1>
      <div class="row"><span class="tag">${ERAS[c.era].name}</span><span class="tag">${esc(c.country)}</span><span class="tag">${yrs(c)}</span>${c.woman?`<span class="tag">Kona í tónlistarsögunni</span>`:""}</div>
      <p class="lead">${esc(c.intro)}</p>
      ${c.credit?`<p class="credit">Mynd: ${c.src?`<a href="${esc(c.src)}" target="_blank" rel="noopener">${esc(c.credit)}</a>`:esc(c.credit)}</p>`:""}
    </div></div>
    <div class="wk-body">
      <div><h2>Hlustaðu</h2>${v0?vidHtml(v0,col,false):""}${vr.length?`<div class="vgrid">${vr.map(v=>vidHtml(v,col,true)).join("")}</div>`:""}
        ${c.pop&&c.pop.length?`<div class="pop"><h3>Þú hefur kannski heyrt þetta…</h3><ul>${c.pop.map(p=>`<li>${esc(p)}</li>`).join("")}</ul></div>`:""}
        ${bwHtml(c)}
      </div>
      <div><h2>Nokkrar staðreyndir um ${esc(c.short)}</h2><ul class="facts">${c.facts.map(f=>`<li>${esc(f)}</li>`).join("")}</ul>
        ${c.ask&&c.ask.length?`<div class="ask"><h3>Hlustunarspurningar</h3><ol>${c.ask.map(a=>`<li>${esc(a)}</li>`).join("")}</ol></div>`:""}
      </div>
    </div>`;
}
wkPick.addEventListener("change",()=>renderWeek(+wkPick.value));
document.getElementById("wkPrev").onclick=()=>renderWeek(wkI-1);
document.getElementById("wkNext").onclick=()=>renderWeek(wkI+1);
document.getElementById("wkRand").onclick=()=>{ let r; do{ r=Math.floor(Math.random()*WEEKS.length);}while(r===wkI&&WEEKS.length>1); renderWeek(r); };
document.getElementById("wkFull").onclick=()=>{ try{ const p=wkEl.requestFullscreen?wkEl.requestFullscreen():null; if(p&&p.catch) p.catch(()=>{}); }catch(e){} };
document.addEventListener("keydown",ev=>{
  if(document.querySelector('[data-view="vikan"]').hidden || ev.target.closest("input,select,textarea") || dlg.open) return;
  if(ev.key==="ArrowRight") renderWeek(wkI+1); else if(ev.key==="ArrowLeft") renderWeek(wkI-1);
});
renderWeek(wkI);

/* Flipar */
const VIEWS=["timalina","vikan","thekkir"];
function show(v){
  if(typeof closePanel==="function") closePanel();
  document.querySelectorAll(".view").forEach(s=>{const on=s.dataset.view===v; s.hidden=!on; if(on){s.classList.remove("enter");void s.offsetWidth;s.classList.add("enter");}});
  document.getElementById("namebar").hidden = v!=="timalina"; setHH();
  bgl.hidden = v!=="timalina";
  document.body.classList.toggle("on-tl", v==="timalina");
  if(v==="timalina"){ lastEra=""; layout(); } else document.body.style.backgroundColor="";
  document.querySelectorAll("nav.tabs a").forEach(a=>{ if(a.dataset.nav===v) a.setAttribute("aria-current","page"); else a.removeAttribute("aria-current"); });
}
document.querySelectorAll("nav.tabs a, a.brand").forEach(a=>a.addEventListener("click",ev=>{
  const v=a.getAttribute("href").slice(1); ev.preventDefault(); show(v); window.scrollTo({top:0,behavior:"auto"});
  try{ history.replaceState(null,"","#"+v); }catch(e){}
}));
function route(){
  const h=location.hash.slice(1);
  if(byId[h]){ if(byId[h].tl!==TL) setTL(byId[h].tl); show("timalina"); openComposer(h); return; }
  show(VIEWS.includes(h)?h:"timalina");
}
window.addEventListener("hashchange",route);
try{ const s=localStorage.getItem("tss-tl"); if(s==="daegur"){ TL="daegur"; document.querySelectorAll("#tlSwitch button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.tl===TL?"true":"false")); } }catch(e){}
buildStory();
route();
</script>

</body>
